name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # +page.svelte imports media.json at build time. The file is gitignored.
      - name: Create fake media.json
        run: echo '{"lastUpdate":"","media":[{"id":"0","caption":"","category":"","timestamp":"2000-01-01T00:00:00+0000","permalink":"","media_type":"IMAGE","username":"","dimensions":{"width":1,"height":1}}]}' > src/lib/assets/media.json

      - name: Biome
        run: bun x biome ci

      - name: Svelte check
        run: bun run check
